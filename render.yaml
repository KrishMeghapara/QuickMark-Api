# Render Blueprint for QuickMart API
# This file can be used for automatic deployment configuration

services:
  - type: web
    name: quickmart-api
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false  # Set this manually in Render dashboard
      - key: Jwt__Key
        sync: false  # Set this manually in Render dashboard
      - key: Jwt__Issuer
        value: QuickCommerceApiForEx
      - key: Jwt__Audience
        value: QuickCommerceApiForExUsers
      - key: Google__ClientId
        sync: false  # Set this manually in Render dashboard
